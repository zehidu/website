<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoFlow Admin — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] }, colors: { brand: { 400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',900:'#312e81' } } } }
    }
  </script>
  <style>
    body { background: radial-gradient(ellipse at top left, #1a1a4e 0%, #0f0c29 50%, #111827 100%); }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px #1f2937 inset !important; -webkit-text-fill-color: #fff !important; }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-2 text-2xl font-black text-white">
        <span class="w-10 h-10 bg-brand-500 rounded-xl flex items-center justify-center text-white font-black">A</span>
        Auto<span class="text-brand-400">Flow</span>
      </a>
      <p class="text-gray-500 text-sm mt-2">Admin Portal</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-2xl p-8">
      <h1 class="text-2xl font-bold text-white mb-1">Welcome back</h1>
      <p class="text-gray-400 text-sm mb-8">Sign in to your admin dashboard</p>

      <div id="error-msg" class="hidden mb-5 flex items-center gap-3 bg-red-950/60 border border-red-800/50 text-red-300 text-sm rounded-xl px-4 py-3">
        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <span id="error-text">Invalid credentials. Please try again.</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Email address</label>
          <input id="email" type="email" placeholder="admin@therenewup.com" required autocomplete="email"
            class="w-full bg-gray-800/60 border border-white/10 focus:border-brand-500 text-white placeholder-gray-600 rounded-xl px-4 py-3.5 outline-none transition-colors text-sm" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
          <div class="relative">
            <input id="password" type="password" placeholder="••••••••••" required autocomplete="current-password"
              class="w-full bg-gray-800/60 border border-white/10 focus:border-brand-500 text-white placeholder-gray-600 rounded-xl px-4 py-3.5 pr-12 outline-none transition-colors text-sm" />
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors p-1">
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-gray-400 cursor-pointer">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-gray-800 border-gray-600 text-brand-500" />
            Remember me
          </label>
        </div>
        <button type="submit" id="login-btn"
          class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl transition-all text-sm flex items-center justify-center gap-2">
          <span id="btn-text">Sign In</span>
          <svg id="btn-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-white/5 text-center">
        <a href="../index.html" class="text-gray-500 hover:text-gray-300 text-sm transition-colors">← Back to website</a>
      </div>
    </div>

    <p class="text-center text-gray-700 text-xs mt-6">AutoFlow Admin · Restricted Access</p>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('af_auth')) window.location.href = 'dashboard.html';

    function togglePassword() {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');

      btn.disabled = true;
      btnText.textContent = 'Signing in...';
      spinner.classList.remove('hidden');

      setTimeout(() => {
        const ADMIN_EMAIL = 'admin@therenewup.com';
        const ADMIN_PASS  = 'AutoFlow2025!';

        if (email === ADMIN_EMAIL && password === ADMIN_PASS) {
          const session = { email, name: 'Admin', loginAt: Date.now() };
          if (document.getElementById('remember').checked) {
            localStorage.setItem('af_auth', JSON.stringify(session));
          } else {
            sessionStorage.setItem('af_auth', JSON.stringify(session));
            localStorage.setItem('af_auth', JSON.stringify(session));
          }
          window.location.href = 'dashboard.html';
        } else {
          document.getElementById('error-msg').classList.remove('hidden');
          document.getElementById('login-form').classList.add('shake');
          setTimeout(() => document.getElementById('login-form').classList.remove('shake'), 400);
          btn.disabled = false;
          btnText.textContent = 'Sign In';
          spinner.classList.add('hidden');
        }
      }, 800);
    }
  </script>
</body>
</html>
